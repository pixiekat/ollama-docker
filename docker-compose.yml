services:
  ollama:
    image: ollama/ollama:${TAG_OLLAMA:?set TAG_OLLAMA in .env}
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_IP:-127.0.0.1}:11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_MAX_LOADED_MODELS=2
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama_data:/root/.ollama
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  webui:
    depends_on:
      - ollama
    image: ghcr.io/open-webui/open-webui:${TAG_OPENWEBUI:?set TAG_OPENWEBUI in .env}
    container_name: ollama-webui
    restart: unless-stopped
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "${OPEN_WEBUI_IP:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set this in .env}
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  ollama_data:
    name: ollama_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUME_ROOT:-/home/katy/docker_volumes}/ollama_data
  openwebui_data:
    name: openwebui_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_VOLUME_ROOT:-/home/katy/docker_volumes}/openwebui_data
